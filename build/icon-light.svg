<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="light-squircle-shadow" x="-12%" y="-10%" width="134%" height="134%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.30"/>
    </filter>

    <linearGradient id="light-chassis-grad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f4f4f5"/>
      <stop offset="65%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>

    <linearGradient id="light-chassis-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#f4f4f5" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#d4d4d8" stop-opacity="0.9"/>
    </linearGradient>

    <radialGradient id="light-acoustic-glow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    
    <filter id="light-headphone-shadow" x="-20%" y="-15%" width="140%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="light-cup-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.30"/>
    </filter>

    <linearGradient id="light-headband-outer-wire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="30%" stop-color="#71717a"/>
      <stop offset="50%" stop-color="#a1a1aa"/>
      <stop offset="70%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>

    <linearGradient id="light-headband-inner-wire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="40%" stop-color="#52525b"/>
      <stop offset="80%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>

    <linearGradient id="light-apex-pad-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <linearGradient id="light-shell-grad-left" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="35%" stop-color="#27272a"/>
      <stop offset="70%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <linearGradient id="light-shell-plate-left" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="35%" stop-color="#27272a"/>
      <stop offset="75%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <linearGradient id="light-shell-grad-right" x1="85%" y1="10%" x2="15%" y2="90%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="35%" stop-color="#27272a"/>
      <stop offset="70%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <linearGradient id="light-shell-plate-right" x1="85%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="35%" stop-color="#27272a"/>
      <stop offset="75%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <linearGradient id="light-earpad-leather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f1f23"/>
      <stop offset="40%" stop-color="#141416"/>
      <stop offset="80%" stop-color="#0c0c0e"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>

    <linearGradient id="light-hinge-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="50%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>

    <radialGradient id="light-amber-accent-glow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
  
  </defs>

  <!-- 1. Brushed Aluminum Chassis (824x824 at 100, 100) -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185"
        fill="url(#light-chassis-grad)"
        filter="url(#light-squircle-shadow)"/>

  <!-- 2. Crisp White Specular Rim Highlight -->
  <rect x="102" y="102" width="820" height="820" rx="183" ry="183"
        fill="none"
        stroke="url(#light-chassis-rim)"
        stroke-width="2.5"
        opacity="0.95"/>

  <!-- Inner Chassis Precision Inset -->
  <rect x="124" y="124" width="776" height="776" rx="160" ry="160"
        fill="none"
        stroke="#e4e4e7"
        stroke-width="1.2"
        opacity="0.6"/>

  <circle cx="512" cy="520" r="340" fill="url(#light-acoustic-glow)"/>

  <!-- 3. High-Contrast Dark Charcoal/Gunmetal Sony Eggo Headphones Motif -->
  
  <g filter="url(#light-headphone-shadow)">
    <!-- A. DUAL-WIRE STEEL HEADBAND ARCH -->
    <!-- Outer Stainless Wire -->
    <path d="M 324,472 C 324,286 408,212 512,212 C 616,212 700,286 700,472"
          fill="none"
          stroke="url(#light-headband-outer-wire)"
          stroke-width="7"
          stroke-linecap="round"/>

    <!-- Inner Stainless Wire -->
    <path d="M 342,482 C 342,316 418,246 512,246 C 606,246 682,316 682,482"
          fill="none"
          stroke="url(#light-headband-inner-wire)"
          stroke-width="7"
          stroke-linecap="round"/>

    <!-- Specular Track Highlights -->
    <path d="M 324,472 C 324,286 408,212 512,212 C 616,212 700,286 700,472"
          fill="none"
          stroke="#ffffff"
          stroke-width="1.5"
          stroke-linecap="round"
          opacity="0.4"/>

    <!-- B. HEADBAND APEX CUSHION PAD -->
    <rect x="424" y="202" width="176" height="34" rx="14"
          fill="url(#light-apex-pad-grad)"
          stroke="#18181b"
          stroke-width="1.5"/>

    <line x1="452" y1="206" x2="452" y2="232" stroke="#27272a" stroke-width="2" stroke-linecap="round"/>
    <line x1="482" y1="206" x2="482" y2="232" stroke="#27272a" stroke-width="2" stroke-linecap="round"/>
    <line x1="512" y1="206" x2="512" y2="232" stroke="#27272a" stroke-width="2" stroke-linecap="round"/>
    <line x1="542" y1="206" x2="542" y2="232" stroke="#27272a" stroke-width="2" stroke-linecap="round"/>
    <line x1="572" y1="206" x2="572" y2="232" stroke="#27272a" stroke-width="2" stroke-linecap="round"/>

    <rect x="420" y="200" width="10" height="38" rx="3" fill="url(#light-hinge-metal)" stroke="#09090b" stroke-width="1"/>
    <rect x="594" y="200" width="10" height="38" rx="3" fill="url(#light-hinge-metal)" stroke="#09090b" stroke-width="1"/>

    <!-- C. ARTICULATED FOLDING HINGE YOKES -->
    <!-- Left Hinge Block -->
    <g transform="translate(324, 474)">
      <rect x="-18" y="-12" width="36" height="42" rx="7" fill="url(#light-hinge-metal)" stroke="#09090b" stroke-width="1.5"/>
      <circle cx="0" cy="10" r="10" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
      <circle cx="0" cy="10" r="6" fill="#27272a"/>
      <circle cx="0" cy="10" r="3.5" fill="url(#light-amber-accent-glow)"/>
    </g>

    <!-- Right Hinge Block -->
    <g transform="translate(700, 474)">
      <rect x="-18" y="-12" width="36" height="42" rx="7" fill="url(#light-hinge-metal)" stroke="#09090b" stroke-width="1.5"/>
      <circle cx="0" cy="10" r="10" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
      <circle cx="0" cy="10" r="6" fill="#27272a"/>
      <circle cx="0" cy="10" r="3.5" fill="#ef4444"/>
    </g>

    <!-- D. LEFT SONY EGGO EARCUP -->
    <g transform="translate(350, 622) rotate(9.5)" filter="url(#light-cup-depth)">
      <path d="M 35,-132 C 68,-132 102,-68 106,14 C 110,88 88,132 35,132 C 60,95 65,15 65,-10 C 65,-75 52,-110 35,-132 Z" fill="url(#light-earpad-leather)" stroke="#050506" stroke-width="2"/>
      <path d="M 52,-90 C 72,-30 72,40 52,100" fill="none" stroke="#27272a" stroke-width="2" opacity="0.65"/>

      <path d="M 0,-135 C 50,-135 84,-70 87,15 C 90,85 68,135 0,135 C -68,135 -90,85 -87,15 C -84,-70 -50,-135 0,-135 Z" fill="url(#light-shell-grad-left)" stroke="#09090b" stroke-width="3"/>
      <path d="M 0,-135 C 50,-135 84,-70 87,15 C 90,85 68,135 0,135 C -68,135 -90,85 -87,15 C -84,-70 -50,-135 0,-135 Z" fill="none" stroke="#52525b" stroke-width="1.8" opacity="0.65"/>

      <path d="M 0,-108 C 38,-108 65,-55 68,12 C 70,68 53,108 0,108 C -53,108 -70,68 -68,12 C -65,-55 -38,-108 0,-108 Z" fill="url(#light-shell-plate-left)" stroke="#09090b" stroke-width="2"/>
      <path d="M 0,-108 C 38,-108 65,-55 68,12 C 70,68 53,108 0,108 C -53,108 -70,68 -68,12 C -65,-55 -38,-108 0,-108 Z" fill="none" stroke="#71717a" stroke-width="1.2" opacity="0.6"/>

      <!-- Bass Micro-Vent -->
      <g transform="translate(-15, -45)">
        <rect x="-4" y="-18" width="8" height="36" rx="4" fill="#09090b" stroke="#27272a" stroke-width="1"/>
        <line x1="-1" y1="-12" x2="-1" y2="12" stroke="#3f3f46" stroke-width="1.2" stroke-linecap="round"/>
      </g>

      <!-- Gimbal Joint -->
      <circle cx="4" cy="8" r="24" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
      <circle cx="4" cy="8" r="18" fill="url(#light-hinge-metal)"/>
      <circle cx="4" cy="8" r="9" fill="#09090b" stroke="#52525b" stroke-width="1"/>

      <!-- Amber Strain-Relief Collar -->
      <g transform="translate(-8, 134)">
        <rect x="-8" y="0" width="16" height="10" rx="2.5" fill="url(#light-amber-accent-glow)" stroke="#b45309" stroke-width="0.8"/>
        <path d="M -6,10 L -4,24 L 4,24 L 6,10 Z" fill="#18181b" stroke="#09090b" stroke-width="0.8"/>
        <path d="M 0,24 C 2,42 16,68 34,82" fill="none" stroke="#27272a" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M 0,24 C 2,42 16,68 34,82" fill="none" stroke="#52525b" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
      </g>
    </g>

    <!-- E. RIGHT SONY EGGO EARCUP -->
    <g transform="translate(674, 622) rotate(-9.5) scale(-1, 1)" filter="url(#light-cup-depth)">
      <path d="M 35,-132 C 68,-132 102,-68 106,14 C 110,88 88,132 35,132 C 60,95 65,15 65,-10 C 65,-75 52,-110 35,-132 Z" fill="url(#light-earpad-leather)" stroke="#050506" stroke-width="2"/>
      <path d="M 52,-90 C 72,-30 72,40 52,100" fill="none" stroke="#27272a" stroke-width="2" opacity="0.65"/>

      <path d="M 0,-135 C 50,-135 84,-70 87,15 C 90,85 68,135 0,135 C -68,135 -90,85 -87,15 C -84,-70 -50,-135 0,-135 Z" fill="url(#light-shell-grad-right)" stroke="#09090b" stroke-width="3"/>
      <path d="M 0,-135 C 50,-135 84,-70 87,15 C 90,85 68,135 0,135 C -68,135 -90,85 -87,15 C -84,-70 -50,-135 0,-135 Z" fill="none" stroke="#52525b" stroke-width="1.8" opacity="0.65"/>

      <path d="M 0,-108 C 38,-108 65,-55 68,12 C 70,68 53,108 0,108 C -53,108 -70,68 -68,12 C -65,-55 -38,-108 0,-108 Z" fill="url(#light-shell-plate-right)" stroke="#09090b" stroke-width="2"/>
      <path d="M 0,-108 C 38,-108 65,-55 68,12 C 70,68 53,108 0,108 C -53,108 -70,68 -68,12 C -65,-55 -38,-108 0,-108 Z" fill="none" stroke="#71717a" stroke-width="1.2" opacity="0.6"/>

      <!-- Bass Micro-Vent -->
      <g transform="translate(-15, -45)">
        <rect x="-4" y="-18" width="8" height="36" rx="4" fill="#09090b" stroke="#27272a" stroke-width="1"/>
        <line x1="-1" y1="-12" x2="-1" y2="12" stroke="#3f3f46" stroke-width="1.2" stroke-linecap="round"/>
      </g>

      <!-- Gimbal Joint -->
      <circle cx="4" cy="8" r="24" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
      <circle cx="4" cy="8" r="18" fill="url(#light-hinge-metal)"/>
      <circle cx="4" cy="8" r="9" fill="#09090b" stroke="#52525b" stroke-width="1"/>
    </g>
  </g>
  
</svg>